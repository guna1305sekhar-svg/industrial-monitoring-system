
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Industrial Monitoring</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    header {
      background: #10243b;
      color: white;
      padding: 24px;
      text-align: center;
    }

    header p { color: #cbd5e1; }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 22px;
    }

    .summary {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      border-left: 5px solid #16a34a;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0000000d;
    }

    .card h3 {
      color: #526176;
      font-size: 15px;
    }

    .value {
      font-size: 28px;
      font-weight: bold;
    }

    .status {
      font-weight: bold;
      color: #15803d;
    }

    .warning { color: #b45309; }
    .danger { color: #dc2626; }

    button {
      background: #1d4ed8;
      color: white;
      padding: 12px 18px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      margin-top: 12px;
    }

    footer {
      text-align: center;
      padding: 24px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <header>
    <h1>Smart Industrial Monitoring System</h1>
    <p>IoT-Based Machine Safety and Monitoring Dashboard</p>
  </header>

  <main>
    <section class="summary">
      <h2>Machine Overview</h2>
      <p>Connection: <strong id="connection">Demo Mode</strong></p>
      <p>Overall Status:
        <strong id="overall" class="status">NORMAL</strong>
      </p>
      <p>Last Updated: <span id="updated">--</span></p>
      <button onclick="updateDashboard()">
        Refresh Demo Readings
      </button>
    </section>

    <section class="grid" id="sensors"></section>
  </main>

  <footer>
    Final Year Project | ECE | IoT05
  </footer>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA7zTw1NOBNQs4HJLyA9uEtxT7WVWpjoU",
    authDomain: "industrial-monitoring-sy-8f62f.firebaseapp.com",
    databaseURL: "https://industrial-monitoring-sy-8f62f-default-rtdb.firebaseio.com",
    projectId: "industrial-monitoring-sy-8f62f",
    storageBucket: "industrial-monitoring-sy-8f62f.firebasestorage.app",
    messagingSenderId: "365621957745",
    appId: "1:365621957745:web:1643bbfc59fcaf2d89f7d0"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  const sensors = [
    { name: "Temperature", key: "temperature", value: 0, unit: " °C", warning: 60, danger: 70 },
    { name: "Humidity", key: "humidity", value: 0, unit: " %", warning: 80, danger: 90 },
    { name: "Gas Level", key: "gas", value: 0, unit: " ADC", warning: 1000, danger: 2500 },
    { name: "Vibration", key: "vibration", value: 0, unit: "", warning: 1, danger: 2 },
    { name: "Fire Sensor", key: "fire", value: 0, unit: "", warning: 1, danger: 1 },
    { name: "Current", key: "current", value: 0, unit: " A", warning: 6, danger: 10 },
    { name: "Voltage", key: "voltage", value: 0, unit: " V", warning: 0, danger: 0 }
  ];

  function getStatus(sensor) {
    if (sensor.name === "Fire Sensor" && Number(sensor.value) === 1)
      return "DANGER";

    if (sensor.name === "Vibration" && Number(sensor.value) === 1)
      return "WARNING";

    if (sensor.name === "Voltage") {
      if (sensor.value < 200 || sensor.value > 250) return "DANGER";
      return "NORMAL";
    }

    if (sensor.value >= sensor.danger) return "DANGER";
    if (sensor.value >= sensor.warning) return "WARNING";
    return "NORMAL";
  }

  function renderDashboard() {
    const container = document.getElementById("sensors");
    container.innerHTML = "";

    sensors.forEach(sensor => {
      const status = getStatus(sensor);
      const card = document.createElement("div");
      card.className = "card";

      const heading = document.createElement("h3");
      heading.textContent = sensor.name;

      const value = document.createElement("p");
      value.className = "value";
      value.textContent = sensor.value + sensor.unit;

      const state = document.createElement("p");
      state.className = "status";
      state.textContent = status;
      if (status === "WARNING") state.classList.add("warning");
      if (status === "DANGER") state.classList.add("danger");

      card.append(heading, value, state);
      container.appendChild(card);
    });

    const unsafe = sensors.some(s => getStatus(s) !== "NORMAL");
    const overall = document.getElementById("overall");
    overall.textContent = unsafe ? "CHECK REQUIRED" : "NORMAL";
    overall.className = unsafe ? "danger" : "status";

    document.getElementById("updated").textContent =
      new Date().toLocaleTimeString();
  }

  // Sign in using the Email/Password account created in Firebase.
  // The account email and password are entered through browser prompts.
  async function connectDashboard() {
    const email = prompt("Enter your Firebase dashboard account email:");
    if (!email) return;

    const password = prompt("Enter your Firebase dashboard account password:");
    if (!password) return;

    try {
      await signInWithEmailAndPassword(auth, email, password);

      onValue(ref(db, "sensors"), snapshot => {
        const data = snapshot.val();

        if (!data) {
          document.getElementById("overall").textContent =
            "Waiting for sensor data";
          document.getElementById("updated").textContent =
            "Firebase connected; no readings received yet";
          return;
        }

        sensors.forEach(sensor => {
          if (data[sensor.key] !== undefined) {
            sensor.value = Number(data[sensor.key]);
          }
        });

        renderDashboard();
      }, error => {
        console.error("Database read failed:", error);
        document.getElementById("overall").textContent =
          "Database read failed";
      });
    } catch (error) {
      console.error("Firebase sign-in failed:", error);
      alert("Firebase sign-in failed. Check your email, password, and Authentication settings.");
    }
  }

  renderDashboard();
  connectDashboard();
</script>
