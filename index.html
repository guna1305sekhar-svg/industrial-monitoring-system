
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Industrial Monitoring</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    header {
      background: #10243b;
      color: white;
      padding: 24px;
      text-align: center;
    }

    header p { color: #cbd5e1; }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 22px;
    }

    .summary {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 20px;
      border-left: 5px solid #16a34a;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #0000000d;
    }

    .card h3 {
      color: #526176;
      font-size: 15px;
    }

    .value {
      font-size: 28px;
      font-weight: bold;
    }

    .status {
      font-weight: bold;
      color: #15803d;
    }

    .warning { color: #b45309; }
    .danger { color: #dc2626; }

    button {
      background: #1d4ed8;
      color: white;
      padding: 12px 18px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      margin-top: 12px;
    }

    footer {
      text-align: center;
      padding: 24px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <header>
    <h1>Smart Industrial Monitoring System</h1>
    <p>IoT-Based Machine Safety and Monitoring Dashboard</p>
  </header>

  <main>
    <section class="summary">
      <h2>Machine Overview</h2>
      <p>Connection: <strong id="connection">Demo Mode</strong></p>
      <p>Overall Status:
        <strong id="overall" class="status">NORMAL</strong>
      </p>
      <p>Last Updated: <span id="updated">--</span></p>
      <button onclick="updateDashboard()">
        Refresh Demo Readings
      </button>
    </section>

    <section class="grid" id="sensors"></section>
  </main>

  <footer>
    Final Year Project | ECE | IoT05
  </footer>

  <script>
    const sensors = [
      { name: "Temperature", value: 35, unit: "°C",
        warning: 60, danger: 70 },
      { name: "Humidity", value: 40, unit: "%",
        warning: 80, danger: 90 },
      { name: "Gas Level", value: 200, unit: " ADC",
        warning: 1000, danger: 2500 },
      { name: "Vibration", value: 0, unit: "",
        warning: 1, danger: 2 },
      { name: "Fire Sensor", value: 0, unit: "",
        warning: 1, danger: 1 },
      { name: "Current", value: 3, unit: " A",
        warning: 6, danger: 10 },
      { name: "Voltage", value: 230, unit: " V",
        warning: 0, danger: 0 }
    ];

    function getStatus(sensor) {
      if (sensor.name === "Fire Sensor" &&
          sensor.value === 1) return "DANGER";

      if (sensor.name === "Vibration" &&
          sensor.value === 1) return "WARNING";

      if (sensor.name === "Voltage") {
        if (sensor.value < 200) return "DANGER";
        if (sensor.value > 250) return "DANGER";
        return "NORMAL";
      }

      if (sensor.value >= sensor.danger) return "DANGER";
      if (sensor.value >= sensor.warning) return "WARNING";
      return "NORMAL";
    }

    function updateDashboard() {
      // Demonstration only: generate sample readings.
      sensors.forEach(sensor => {
        if (sensor.name === "Temperature")
          sensor.value = +(25 + Math.random() * 50).toFixed(1);
        else if (sensor.name === "Humidity")
          sensor.value = Math.round(35 + Math.random() * 45);
        else if (sensor.name === "Gas Level")
          sensor.value = Math.round(Math.random() * 3000);
        else if (sensor.name === "Vibration")
          sensor.value = Math.random() < 0.8 ? 0 : 1;
        else if (sensor.name === "Fire Sensor")
          sensor.value = Math.random() < 0.95 ? 0 : 1;
        else if (sensor.name === "Current")
          sensor.value = +(1 + Math.random() * 10).toFixed(1);
        else if (sensor.name === "Voltage")
          sensor.value = Math.round(180 + Math.random() * 100);
      });

      renderDashboard();
    }

    function renderDashboard() {
      const container = document.getElementById("sensors");
      container.innerHTML = "";

      sensors.forEach(sensor => {
        const status = getStatus(sensor);
        const card = document.createElement("div");
        card.className = "card";

        const heading = document.createElement("h3");
        heading.textContent = sensor.name;

        const value = document.createElement("p");
        value.className = "value";
        value.textContent = sensor.value + sensor.unit;

        const state = document.createElement("p");
        state.className = "status";
        state.textContent = status;
        if (status === "WARNING") state.classList.add("warning");
        if (status === "DANGER") state.classList.add("danger");

        card.append(heading, value, state);
        container.appendChild(card);
      });

      const unsafe = sensors.some(s =>
        getStatus(s) !== "NORMAL"
      );

      const overall = document.getElementById("overall");
      overall.textContent = unsafe ? "CHECK REQUIRED" : "NORMAL";
      overall.className = unsafe ? "danger" : "status";

      document.getElementById("updated").textContent =
        new Date().toLocaleTimeString();
    }

    renderDashboard();
  </script>
</body>
</html>
